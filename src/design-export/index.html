<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>デザイン書き出し</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
      body {
        overflow: hidden;
      }
      svg {
        display: block;
      }
      /* 動かさない。transition はすべて無効 */
      *,
      *::before,
      *::after {
        transition: none !important;
      }
      /* Home.css の prefers-reduced-motion と同じ（部屋・家具のアニメーションを止める） */
      .twinkle,
      .clouds,
      .curtain-l,
      .curtain-r,
      .sway {
        animation: none !important;
      }
      /* Home.css と同じ置き方 */
      .room-shell,
      .room-tint {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .piece-svg,
      .pet-svg {
        position: absolute;
        overflow: visible;
      }
    </style>
  </head>
  <body>
    <div id="stage"><div id="root"></div></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
